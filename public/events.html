<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events - Club Events</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .event-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
    .event-title { font-weight: bold; font-size: 1.1em; }
    #message-area { margin-bottom: 15px; font-weight: bold; }
    button { margin-top: 8px; padding: 6px 12px; cursor: pointer; }
    a.btn { margin-top: 8px; margin-right: 8px; padding: 6px 12px; cursor: pointer; display: inline-block; text-decoration: none; background: #eee; color: #000; border: 1px solid #ccc; border-radius: 4px; }
    a.btn:hover { background: #ddd; }
  </style>
</head>
<body>
  <h1>Upcoming Events</h1>
  <div id="message-area"></div>
  <div id="organizer-actions" style="margin-bottom: 15px;"></div>
  <div id="events-container">Loading events...</div>
  <button id="logout-btn" style="margin-top: 20px;">Log Out</button>
  <script>
    async function loadEvents() {
      const container = document.getElementById('events-container');
      try {
        const meRes = await fetch('/api/me');
        const meData = await meRes.json();
        const role = meData.success && meData.user ? meData.user.role : (meData.role || null);

        const organizerActions = document.getElementById('organizer-actions');
        organizerActions.textContent = '';
        if (role === 'organizer' || role === 'admin') {
          const createBtn = document.createElement('button');
          createBtn.textContent = 'Create event';
          createBtn.style.marginRight = '8px';
          createBtn.addEventListener('click', () => {
            window.location.href = '/event';
          });
          organizerActions.appendChild(createBtn);
        }

        if (role === 'admin') {
          const usersLink = document.createElement('a');
          usersLink.id = 'users-link';
          usersLink.href = '/admin/users';
          usersLink.textContent = 'Users';
          usersLink.className = 'btn';
          organizerActions.appendChild(usersLink);
        }

        const res = await fetch('/api/events');
        const data = await res.json();
        if (data.success && data.events) {
          container.textContent = '';
          if (data.events.length === 0) {
            const p = document.createElement('p');
            p.textContent = 'No upcoming events found.';
            container.appendChild(p);
            return;
          }
          data.events.forEach(ev => {
            const card = document.createElement('div');
            card.className = 'event-card';

            const titleEl = document.createElement('a');
            titleEl.className = 'event-title';
            titleEl.textContent = ev.title;
            titleEl.href = `/event-details?id=${ev.id}`;
            titleEl.style.display = 'block';
            titleEl.style.color = '#0066cc';
            titleEl.style.textDecoration = 'none';

            const dateEl = document.createElement('div');
            const dateStr = new Date(ev.starts_at).toLocaleString();
            dateEl.textContent = `Date: ${dateStr}`;

            const freeEl = document.createElement('div');
            freeEl.textContent = `Free Places: ${ev.free_places}`;

            const statusEl = document.createElement('div');
            if (ev.status === 'cancelled') {
              statusEl.textContent = 'Status: Cancelled';
              statusEl.style.color = 'red';
            }

            card.appendChild(titleEl);
            card.appendChild(dateEl);
            card.appendChild(freeEl);
            if (ev.status === 'cancelled') {
              card.appendChild(statusEl);
            }

            if (role === 'member' && ev.status !== 'cancelled') {
              const signUpBtn = document.createElement('button');
              signUpBtn.textContent = 'Sign Up';
              signUpBtn.addEventListener('click', async () => {
                signUpBtn.disabled = true;
                const messageArea = document.getElementById('message-area');
                try {
                  const signupRes = await fetch(`/api/events/${ev.id}/signup`, { method: 'POST' });
                  const signupData = await signupRes.json();
                  if (signupRes.ok && signupData.success) {
                    messageArea.textContent = signupData.message || 'You are signed up';
                    loadEvents();
                  } else {
                    messageArea.textContent = signupData.error || signupData.message || 'Error signing up';
                    signUpBtn.disabled = false;
                  }
                } catch (err) {
                  messageArea.textContent = 'Error signing up';
                  signUpBtn.disabled = false;
                }
              });
              card.appendChild(signUpBtn);
            }

            container.appendChild(card);
          });
        } else {
          container.textContent = 'Failed to load events.';
        }
      } catch (err) {
        container.textContent = 'Error loading events.';
      }
    }

    loadEvents();

    document.getElementById('logout-btn').addEventListener('click', async () => {
      const res = await fetch('/api/auth/logout', { method: 'POST' });
      const data = await res.json();
      if (data.redirect) {
        window.location.href = data.redirect;
      }
    });
  </script>
</body>
</html>
