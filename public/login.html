<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In / Sign Up - Club Events</title>
  <link rel="stylesheet" href="/login-assets/style.css">
</head>
<body>
  <div class="container">
    <h1>Club Events</h1>
    <div id="error-message" class="error" style="display: none;"></div>
    
    <div class="form-section" id="signin-section">
      <h2>Sign In</h2>
      <form id="login-form">
        <label for="login-email">Email:</label>
        <input type="email" id="login-email" required>
        <label for="login-password">Password:</label>
        <input type="password" id="login-password" required>
        <button type="submit">Sign In</button>
      </form>
      <p class="toggle-text"><a href="#" id="to-signup">No account? Sign up</a></p>
    </div>

    <div class="form-section" id="signup-section" style="display: none;">
      <h2>Sign Up</h2>
      <form id="signup-form">
        <label for="signup-email">Email:</label>
        <input type="email" id="signup-email" required>
        <label for="signup-password">Password:</label>
        <input type="password" id="signup-password" required>
        <button type="submit">Sign Up</button>
      </form>
      <p class="toggle-text"><a href="#" id="to-signin">Already have an account? Sign in</a></p>
    </div>
  </div>
  <script src="/login-assets/login.js"></script>
</body>
</html>
