<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Event - Club Events</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="date"], input[type="time"], input[type="number"], textarea {
      width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
    }
    textarea { height: 100px; }
    #message-area { margin-bottom: 15px; font-weight: bold; color: red; }
    button { padding: 8px 16px; cursor: pointer; }
    a { display: inline-block; margin-top: 15px; text-decoration: none; color: #0066cc; }
  </style>
</head>
<body>
  <h1>Create Event</h1>
  <div id="message-area"></div>
  <form id="create-event-form">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" required>
    </div>
    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>
    <div class="form-group">
      <label for="time">Time</label>
      <input type="time" id="time" required>
    </div>
    <div class="form-group">
      <label for="location">Location</label>
      <input type="text" id="location" required>
    </div>
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" required></textarea>
    </div>
    <div class="form-group">
      <label for="capacity">Limit on Places</label>
      <input type="number" id="capacity" min="1" required>
    </div>
    <button type="submit">Save Event</button>
  </form>
  <p><a href="/events">Back to Events</a></p>

  <script>
    document.getElementById('create-event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageArea = document.getElementById('message-area');
      messageArea.textContent = '';

      const title = document.getElementById('title').value;
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const location = document.getElementById('location').value;
      const description = document.getElementById('description').value;
      const capacity = document.getElementById('capacity').value;

      let starts_at = null;
      if (date && time) {
        starts_at = new Date(`${date}T${time}`).toISOString();
      }

      try {
        const res = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, starts_at, location, description, capacity: Number(capacity) })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/events';
        } else {
          messageArea.textContent = data.error || 'Failed to create event';
        }
      } catch (err) {
        messageArea.textContent = 'Error creating event';
      }
    });
  </script>
</body>
</html>
